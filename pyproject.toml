[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorymesh"
version = "0.3.0"
description = "Local-first persistent memory MCP server with hybrid search and atomic facts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Shinn"},
]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "aiosqlite>=0.20.0,<0.23.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0,<1.0.0",
    "tiktoken>=0.6.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "starlette>=0.37.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific Computing :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.21.0",
]
local = [
    "sentence-transformers>=3.0.0,<6.0.0",
]
cli = [
    "rich>=13.0.0,<14.0.0",
]

[project.scripts]
memorymesh = "memorymesh.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]